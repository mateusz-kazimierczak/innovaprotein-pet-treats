<section class="retail" id="distribuidores">
  <div class="wrap">
    <div class="retail-band">
      <div>
        <div class="eyebrow" data-i18n="retailEyebrow">{{ copy.retailEyebrow | escape }}</div>
        <h2 data-i18n="retailHeading">{{ copy.retailHeading | escape }}</h2>
        <p data-i18n="retailLead">{{ copy.retailLead | escape }}</p>
      </div>
      <div class="retail-right">
        <strong data-i18n="retailRight">{{ copy.retailRight | escape }}</strong>
        <p data-i18n="retailRightDesc">{{ copy.retailRightDesc | escape }}</p>
        <a class="btn" href="#contacto" data-inquiry="retailer">
          <span data-i18n="retailCta">{{ copy.retailCta | escape }}</span>
          <svg class="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"></path></svg>
        </a>
      </div>
    </div>
  </div>
</section>
